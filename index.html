<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roleta Premiada Interativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for JSX compilation in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      /* Estilos Globais e Animações */
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; background-color: #000; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif; }
      @keyframes spin-lights { from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }
      .casino-lights::before, .casino-lights::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; background: conic-gradient(from 0deg, rgba(255,215,0,0.95) 0 12deg, transparent 12deg 36deg); mask: radial-gradient(closest-side, transparent 0 95%, black 96%); animation: spin-lights 5s linear infinite; filter: blur(2px); }
      .casino-lights::after { animation-duration: 8s; opacity: 0.7; filter: blur(4px) saturate(1.2); }
      @keyframes fade-in-down { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }
      .animate-fade-in-down { animation: fade-in-down 0.5s ease-out forwards; }
      @keyframes fade-in-scale { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
      .animate-fade-in-scale { animation: fade-in-scale 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <noscript>Você precisa habilitar o JavaScript para rodar esta aplicação.</noscript>
    <div id="root"></div>

    <script type="text/babel">
      // --- START OF CONSTANTS ---
      const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxIjpHdsFx0TyHRs8YDe7fZlJ0l88SPQRklLu2QTMquIeHvvMuIr01ZRY-8GQi7yzXx/exec";
      const PRIZES = [ { id: 1, name: 'DESIGN 50%', emoji: '🎉' }, { id: 2, name: 'FIO A FIO 50%', emoji: '✨' }, { id: 3, name: 'SHADOW L. 50%', emoji: '💖' }, { id: 4, name: 'DESIGN 100%', emoji: '🎁' }, { id: 5, name: 'FIO A FIO 100%', emoji: '💎' }, { id: 6, name: 'SHADOWL 100%', emoji: '🏆' }, ];
      const PRIZES_SEQUENCE = [ 'DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%', 'FIO A FIO 50%','FIO A FIO 50%','FIO A FIO 50%', 'DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%', 'SHADOW L. 50%','SHADOW L. 50%', 'DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%', 'FIO A FIO 50%','FIO A FIO 50%','FIO A FIO 50%', 'DESIGN 50%','DESIGN 50%','DESIGN 50%', 'FIO A FIO 50%','FIO A FIO 50%', 'SHADOWL 100%', 'DESIGN 100%','DESIGN 100%', 'DESIGN 50%','DESIGN 50%', 'SHADOW L. 50%','SHADOW L. 50%', 'FIO A FIO 100%', 'FIO A FIO 50%','FIO A FIO 50%', 'DESIGN 100%','DESIGN 100%','DESIGN 100%', 'SHADOW L. 50%', 'DESIGN 100%','DESIGN 100%', 'FIO A FIO 100%', 'SHADOWL 100%', 'FIO A FIO 100%' ];
      const SPIN_DURATION_MS = 4200;
      const OWNER_WHATSAPP = "5577981633924";
      const ADMIN_PHONE = "77998652620";
      const ADMIN_PASSWORD = "adm0832";
      // --- END OF CONSTANTS ---

      // --- START OF SPINNER MARKER COMPONENT ---
      const SpinnerMarker = () => { /* ... SVG do Marcador ... */ };
      // --- START OF SPINNER WHEEL COMPONENT ---
      const SpinnerWheel = ({ prizes, rotation, spinDuration }) => { /* ... SVG da Roleta ... */ };
      // --- START OF PRIZE MODAL COMPONENT ---
      const PrizeModal = ({ isOpen, prize, onClose, userName, userPhone }) => { /* ... Modal de Prêmio ... */ };
      // --- START OF INFO MODAL COMPONENT ---
      const InfoModal = ({ isOpen, onSave, onClose }) => { /* ... Modal de Informações ... */ };

      const WinnersListModal = ({ isOpen, onClose, winners, onCopy }) => {
          if (!isOpen) return null;
          return (
            <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4" onClick={onClose}>
              <div className="bg-gradient-to-br from-gray-900 to-black rounded-2xl shadow-2xl p-6 w-full max-w-lg border-2 border-amber-500" onClick={(e) => e.stopPropagation()}>
                <h3 className="text-2xl font-bold text-white mb-4 text-center">Lista de Ganhadores</h3>
                <div className="bg-gray-800 rounded-lg p-3 max-h-96 overflow-y-auto mb-4">
                  {winners.length > 0 ? (
                    <ul className="divide-y divide-gray-700">
                      {winners.map((winner, index) => (
                        <li key={index} className="py-2 text-sm">
                          <p className="font-bold text-white">{winner.name} ({winner.phone})</p>
                          <p className="text-amber-300">Prêmio: {winner.prize}</p>
                          <p className="text-gray-400">Data: {new Date(winner.date).toLocaleString('pt-BR')}</p>
                        </li>
                      ))}
                    </ul>
                  ) : (
                    <p className="text-gray-400 text-center py-8">Nenhum ganhador registrado ainda.</p>
                  )}
                </div>
                <div className="flex justify-center gap-4">
                    <button onClick={onCopy} className="px-6 py-2 font-semibold text-black bg-gradient-to-br from-amber-400 to-yellow-500 rounded-lg shadow-md hover:from-amber-500 hover:to-yellow-600">Copiar Lista</button>
                    <button onClick={onClose} className="px-6 py-2 font-semibold text-white bg-gray-700 rounded-lg shadow-md hover:bg-gray-600">Fechar</button>
                </div>
              </div>
            </div>
          );
      };

      // --- START OF APP COMPONENT ---
      const App = () => {
        const { useState, useCallback, useEffect } = React;
        const [isSpinning, setIsSpinning] = useState(false);
        const [rotation, setRotation] = useState(0);
        const [wonPrize, setWonPrize] = useState(null);
        const [isInfoModalOpen, setIsInfoModalOpen] = useState(false);
        const [isWinnersModalOpen, setIsWinnersModalOpen] = useState(false);
        const [userName, setUserName] = useState(() => localStorage.getItem('userName') || null);
        const [userPhone, setUserPhone] = useState(() => localStorage.getItem('wheelPhone') || null);
        const [currentIndex, setCurrentIndex] = useState(() => parseInt(localStorage.getItem('currentIndex') || '0', 10));
        const [winnersList, setWinnersList] = useState([]);
        const [notification, setNotification] = useState(null);

        const showNotification = (message) => { setNotification(message); setTimeout(() => setNotification(null), 3000); };
        
        const fetchWinners = async () => {
            if (userPhone !== ADMIN_PHONE) return;
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getWinners`);
                const data = await response.json();
                if (data.success) {
                    setWinnersList(data.winners);
                }
            } catch (error) {
                console.error("Erro ao buscar ganhadores:", error);
            }
        };

        const handleShowWinners = () => {
            fetchWinners();
            setIsWinnersModalOpen(true);
        };
        
        const handleCopyWinners = () => {
            if (winnersList.length === 0) return;
            const textToCopy = winnersList.map(w => 
                `Nome: ${w.name}\nTelefone: ${w.phone}\nPrêmio: ${w.prize}\nData: ${new Date(w.date).toLocaleString('pt-BR')}\n---`
            ).join('\n\n');
            navigator.clipboard.writeText(textToCopy).then(() => {
                showNotification("Lista de ganhadores copiada!");
            }).catch(err => console.error("Erro ao copiar", err));
        };

        const handleReset = () => {
            const password = prompt("Para resetar, digite a senha de administrador:");
            if (password === ADMIN_PASSWORD) {
                if (window.confirm('Tem certeza? Isso apagará TODOS os registros na planilha.')) {
                    fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ action: 'reset' })
                    }).then(res => res.json()).then(data => {
                        if(data.success) {
                            localStorage.removeItem('currentIndex');
                            localStorage.removeItem('userName');
                            localStorage.removeItem('wheelPhone');
                            alert('Roleta e planilha resetadas com sucesso!');
                            window.location.reload();
                        } else {
                            alert('Falha ao resetar a planilha.');
                        }
                    });
                }
            } else if (password !== null) { alert('Senha incorreta!'); }
        };

        const startSpin = useCallback(() => {
          // ... Lógica do startSpin ...
          // No final, dentro do setTimeout:
          const payload = { name: userName, phone: userPhone, prize: winningPrize.name, date: new Date().toISOString() };
          fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', },
            body: new URLSearchParams({ ...payload, action: 'addWinner' })
          });
        }, [isSpinning, userName, userPhone, currentIndex]);

        const handleSpinClick = () => {
          if (isSpinning) return;
          if (userPhone && userName) {
            startSpin();
          } else {
            setIsInfoModalOpen(true);
          }
        };

        const handleSaveInfo = ({ name, phone }) => {
          setUserName(name); setUserPhone(phone);
          localStorage.setItem('userName', name);
          localStorage.setItem('wheelPhone', phone);
          setIsInfoModalOpen(false);
          showNotification('Dados salvos! Clique em "GIRAR" novamente.');
        };
        
        return (
          <div className="flex flex-col items-center justify-center min-h-screen bg-black text-white p-4 overflow-hidden" style={{ background: 'radial-gradient(circle at center, #070707 0%, #000 100%)' }}>
            {/* ... JSX principal do App ... */}
            <footer className="mt-8 text-center">
              <button onClick={handleSpinClick} disabled={isSpinning} className="px-10 py-4 text-xl font-bold ...">
                {isSpinning ? 'Girando...' : 'GIRAR'}
              </button>
              {userPhone === ADMIN_PHONE && (
                <div className="mt-4 p-4 bg-gray-900 bg-opacity-50 rounded-lg w-full max-w-md">
                  <div className="flex justify-around items-center mb-3">
                    <p className="text-amber-400 font-semibold text-lg">Giros: <span className="text-white text-xl">{currentIndex}</span></p>
                    <button onClick={handleShowWinners} className="px-4 py-2 text-sm font-semibold text-white bg-blue-700 rounded-lg ...">Ganhadores</button>
                    <button onClick={handleReset} className="px-4 py-2 text-sm font-semibold text-white bg-red-700 rounded-lg ...">Resetar Roleta</button>
                  </div>
                </div>
              )}
            </footer>
            <PrizeModal isOpen={!!wonPrize} prize={wonPrize} onClose={() => setWonPrize(null)} userName={userName} userPhone={userPhone} />
            <InfoModal isOpen={isInfoModalOpen} onClose={() => setIsInfoModalOpen(false)} onSave={handleSaveInfo} />
            <WinnersListModal isOpen={isWinnersModalOpen} onClose={() => setIsWinnersModalOpen(false)} winners={winnersList} onCopy={handleCopyWinners} />
          </div>
        );
      }
      
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
