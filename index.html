<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roleta Premiada Interativa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; background-color:#000; margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Oxygen','Ubuntu','Cantarell','Fira Sans','Droid Sans','Helvetica Neue',sans-serif; }
    @keyframes spin-lights { from{ transform: rotate(0deg);} to{ transform: rotate(360deg);} }
    .casino-lights::before, .casino-lights::after { content:""; position:absolute; inset:-4px; border-radius:50%; background: conic-gradient(from 0deg, rgba(255,215,0,0.95) 0 12deg, transparent 12deg 36deg); mask: radial-gradient(closest-side, transparent 0 95%, black 96%); animation: spin-lights 5s linear infinite; filter: blur(2px); }
    .casino-lights::after { animation-duration:8s; opacity:0.7; filter: blur(4px) saturate(1.2); }
    @keyframes fade-in-down { 0%{opacity:0; transform:translateY(-20px);}100%{opacity:1; transform:translateY(0);} }
    .animate-fade-in-down { animation:fade-in-down 0.5s ease-out forwards; }
    @keyframes fade-in-scale { 0%{opacity:0; transform:scale(0.8);}100%{opacity:1; transform:scale(1);} }
    .animate-fade-in-scale { animation:fade-in-scale 0.3s ease-out forwards; }
  </style>
</head>
<body>
  <noscript>Você precisa habilitar o JavaScript para rodar esta aplicação.</noscript>
  <div id="root"></div>

  <script type="text/babel">
    // ========== CONFIGURAÇÃO JSONBIN - substitua as duas strings abaixo =============
    const JSONBIN_ID = "690feaaa683a4a4a9e0653f1";    // <-- substitua pelo seu Bin ID
    const JSONBIN_API = "XXXXX";  // <-- substitua pela sua X-Master-Key
    // ==============================================================================
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

    // Helper: ler currentIndex do JSONBin (retorna número)
    async function fetchCurrentIndexFromBin() {
      try {
        const res = await fetch(JSONBIN_URL + "/latest", {
          headers: { "X-Master-Key": JSONBIN_API }
        });
        if (!res.ok) throw new Error('Erro fetch index');
        const data = await res.json();
        // Aceita "currentIndex" ou "lastForcedPrizeIndex" para compatibilidade
        return typeof data.record.currentIndex === 'number' ? data.record.currentIndex : (typeof data.record.lastForcedPrizeIndex === 'number' ? data.record.lastForcedPrizeIndex : 0);
      } catch (err) {
        console.warn('Não foi possível ler JSONBin, usando 0 como fallback.', err);
        return 0;
      }
    }

    // Helper: salvar currentIndex no JSONBin
    async function saveCurrentIndexToBin(idx) {
      try {
        await fetch(JSONBIN_URL, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": JSONBIN_API
          },
          body: JSON.stringify({ currentIndex: idx })
        });
      } catch (err) {
        console.error('Erro ao salvar índice no JSONBin', err);
      }
    }

    // ======================= SEUS CONSTANTES / PRÊMIOS =============================
    const PRIZES = [
      { id: 1, name: 'DESIGN 50%', emoji: '🎉' },
      { id: 2, name: 'FIO A FIO 50%', emoji: '✨' },
      { id: 3, name: 'SHADOW L. 50%', emoji: '💖' },
      { id: 4, name: 'DESIGN 100%', emoji: '🎁' },
      { id: 5, name: 'FIO A FIO 100%', emoji: '💎' },
      { id: 6, name: 'SHADOWL 100%', emoji: '🏆' },
    ];

    // Sequência que você já tinha (mantive seu array original)
    const PRIZES_SEQUENCE = [
      'DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%',
      'FIO A FIO 50%','FIO A FIO 50%','FIO A FIO 50%',
      'DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%',
      'SHADOW L. 50%','SHADOW L. 50%',
      'DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%',
      'FIO A FIO 50%','FIO A FIO 50%','FIO A FIO 50%',
      'DESIGN 50%','DESIGN 50%','DESIGN 50%',
      'FIO A FIO 50%','FIO A FIO 50%',
      'SHADOWL 100%',
      'DESIGN 100%','DESIGN 100%',
      'DESIGN 50%','DESIGN 50%',
      'SHADOW L. 50%','SHADOW L. 50%',
      'FIO A FIO 100%',
      'FIO A FIO 50%','FIO A FIO 50%',
      'DESIGN 100%','DESIGN 100%','DESIGN 100%',
      'SHADOW L. 50%',
      'DESIGN 100%','DESIGN 100%',
      'FIO A FIO 100%',
      'SHADOWL 100%',
      'FIO A FIO 100%'
    ];

    const SPIN_DURATION_MS = 4200;
    const OWNER_WHATSAPP = "5577981633924";
    const ADMIN_PHONE = "77998652620";
    const ADMIN_PASSWORD = "adm0832";

    // ======================= COMPONENTES REACT ================================
    const SpinnerMarker = () => (
      <div className="absolute -top-3 md:-top-4 left-1/2 -translate-x-1/2 z-10" style={{ filter: 'drop-shadow(0 6px 8px rgba(0,0,0,0.5))' }}>
        <svg width="40" height="56" viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="marker-gold-grad" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stopColor="#FFF8E6" />
              <stop offset="50%" stopColor="#FFD95A" />
              <stop offset="100%" stopColor="#D4AF37" />
            </linearGradient>
          </defs>
          <path d="M20 56L40 20L20 0L0 20L20 56Z" fill="#111" />
          <path d="M20 52L36 20L20 4L4 20L20 52Z" fill="url(#marker-gold-grad)" />
        </svg>
      </div>
    );

    const SpinnerWheel = ({ prizes, rotation, spinDuration }) => {
      const numPrizes = prizes.length;
      const anglePerSegment = 360 / numPrizes;
      const radius = 160;
      const viewBoxSize = radius * 2 + 40;
      const getCoordinatesForAngle = (angle, r = radius) => {
        const rad = (angle * Math.PI) / 180;
        const x = r * Math.cos(rad);
        const y = r * Math.sin(rad);
        return [x, y];
      };
      return (
        <div className="relative w-[360px] h-[360px] md:w-[450px] md:h-[450px] transition-transform duration-[cubic-bezier(0.25,0.1,0.25,1)]"
             style={{ transform: `rotate(${rotation}deg)`, transitionDuration: `${spinDuration}ms`, filter: 'drop-shadow(0px 10px 15px rgba(0,0,0,0.5))' }}>
          <svg viewBox={`-${viewBoxSize/2} -${viewBoxSize/2} ${viewBoxSize} ${viewBoxSize}`} className="w-full h-full" style={{ transform: 'rotate(-90deg)' }}>
            <defs>
              <radialGradient id="gold-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                <stop offset="0%" stopColor="#FFF8E6"/><stop offset="25%" stopColor="#FFEFB3"/><stop offset="45%" stopColor="#FFD95A"/><stop offset="70%" stopColor="#D4AF37"/><stop offset="100%" stopColor="#7a5e00"/>
              </radialGradient>
              <linearGradient id="black-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#3b3b3b" /><stop offset="50%" stopColor="#1a1a1a" /><stop offset="100%" stopColor="#000000" /></linearGradient>
              <radialGradient id="hub-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%"><stop offset="0%" stopColor="#fff"/><stop offset="60%" stopColor="rgba(255,255,255,0.2)"/><stop offset="100%" stopColor="rgba(255,255,255,0)"/></radialGradient>
            </defs>
            <circle cx="0" cy="0" r={radius + 15} fill="#111" />
            <circle cx="0" cy="0" r={radius + 10} fill="url(#gold-grad)" stroke="#fff" strokeWidth="0.5" strokeOpacity="0.3" />
            <circle cx="0" cy="0" r={radius + 8} fill="transparent" stroke="#000" strokeWidth="1" strokeOpacity="0.5" />
            <g>
              {prizes.map((prize, index) => {
                const startAngle = index * anglePerSegment;
                const endAngle = (index + 1) * anglePerSegment;
                const [startX, startY] = getCoordinatesForAngle(startAngle);
                const [endX, endY] = getCoordinatesForAngle(endAngle);
                const pathData = `M 0 0 L ${startX} ${startY} A ${radius} ${radius} 0 0 1 ${endX} ${endY} Z`;
                const textArcRadius = radius * 0.75;
                const [textArcStartX, textArcStartY] = getCoordinatesForAngle(startAngle + 2, textArcRadius);
                const [textArcEndX, textArcEndY] = getCoordinatesForAngle(endAngle - 2, textArcRadius);
                const textPathId = `text-path-${prize.id}`;
                const textPathData = `M ${textArcStartX} ${textArcStartY} A ${textArcRadius} ${textArcRadius} 0 0 1 ${textArcEndX} ${textArcEndY}`;
                const isGold = index % 2 === 0;
                const textColor = isGold ? '#1a1a1a' : '#FFD700';
                return (
                  <g key={prize.id}>
                    <path d={pathData} fill={isGold ? 'url(#gold-grad)' : 'url(#black-grad)'} stroke="#0b0b0b" strokeWidth="1.6" />
                    <defs><path id={textPathId} d={textPathData} /></defs>
                    <text dy={-4} fill={textColor} fontSize="13" fontWeight="bold" fontFamily="Arial, Helvetica, sans-serif" style={{ userSelect: 'none', textShadow: isGold ? 'none' : '0 0 5px rgba(255,215,0,0.5)' }}>
                      <textPath href={`#${textPathId}`} startOffset="50%" textAnchor="middle" dominantBaseline="middle">{prize.name}</textPath>
                    </text>
                  </g>
                );
              })}
            </g>
            <circle cx="0" cy="0" r={radius * 0.18} fill="#111" />
            <circle cx="0" cy="0" r={radius * 0.15} fill="url(#gold-grad)" />
            <circle cx="0" cy="0" r={radius * 0.12} fill="url(#hub-grad)" />
            <circle cx="0" cy="0" r={radius * 0.05} fill="#b80000" stroke="gold" strokeWidth="1" />
          </svg>
        </div>
      );
    };

    const PrizeModal = ({ isOpen, prize, onClose, userName, userPhone }) => {
      if (!isOpen || !prize) return null;
      const handleWhatsAppShare = () => {
        const message = `🎉 Olá! Meu nome é ${userName} e eu ganhei na Roleta Premiada!\n🏆 Prêmio: ${prize.name}\n📱 Telefone: ${userPhone}`;
        const whatsappUrl = `https://wa.me/${OWNER_WHATSAPP}?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, "_blank");
      };
      return (
        <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4" onClick={onClose} role="dialog" aria-modal="true">
          <div className="relative bg-gradient-to-br from-gray-900 to-black rounded-2xl shadow-2xl p-8 text-center border-2 border-amber-500 animate-fade-in-scale w-full max-w-sm" onClick={(e)=>e.stopPropagation()}>
            <p className="text-2xl text-gray-400 mb-2">Parabéns, {userName}!</p>
            <div className="text-8xl my-6 animate-bounce">{prize.emoji}</div>
            <h2 className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-500 to-amber-400 mb-6" style={{ textShadow:'0 0 12px rgba(255,215,0,0.25)'}}>{prize.name}</h2>
            {userName && userPhone && OWNER_WHATSAPP && (
              <button onClick={handleWhatsAppShare} className="w-full px-6 py-3 mb-4 text-lg font-semibold text-white bg-green-500 rounded-lg shadow-md hover:bg-green-600 focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50 transition-colors duration-300 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.894 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.886-.001 2.267.651 4.383 1.88 6.195l.044.072-1.254 4.579 4.662-1.225.078.044z"></path></svg>
                Enviar via WhatsApp
              </button>
            )}
            <button onClick={onClose} className="w-full px-6 py-3 text-lg font-semibold text-white bg-gray-700 rounded-lg shadow-md hover:bg-gray-600 focus:outline-none focus:ring-4 focus:ring-gray-500 focus:ring-opacity-50 transition-colors duration-300">Fechar</button>
          </div>
        </div>
      );
    };

    const App = () => {
      const { useState, useEffect, useCallback } = React;

      const InfoModal = ({ isOpen, onSave, onClose }) => {
        const [name, setName] = useState('');
        const [phone, setPhone] = useState('');
        const [error, setError] = useState('');
        if (!isOpen) return null;
        const handleSave = () => {
          const trimmedName = name.trim();
          const rawPhone = phone.trim().replace(/\D/g, '');
          if (!trimmedName) { setError('Por favor, digite seu nome completo.'); return; }
          if (!/^\d{10,13}$/.test(rawPhone)) { setError('Digite um telefone válido (somente dígitos, 10–13 caracteres)'); return; }
          setError('');
          onSave({ name: trimmedName, phone: rawPhone });
        };
        const handleClose = () => { setName(''); setPhone(''); setError(''); onClose(); };
        return (
          <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4" onClick={handleClose} role="dialog" aria-modal="true">
            <div className="relative bg-gradient-to-br from-gray-900 to-black rounded-2xl shadow-2xl p-8 text-center border-2 border-amber-500 animate-fade-in-scale w-full max-w-md" onClick={(e)=>e.stopPropagation()}>
              <h3 className="text-2xl font-bold text-white mb-4">Informe seus dados para girar</h3>
              <input type="text" placeholder="Nome Completo" value={name} onChange={(e)=>setName(e.target.value)} className="w-full px-4 py-3 bg-gray-800 text-white border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 mb-4 text-center" aria-label="Nome Completo"/>
              <input type="tel" placeholder="DDD + Telefone (só dígitos)" maxLength={15} value={phone} onChange={(e)=>setPhone(e.target.value.replace(/\D/g, ''))} className="w-full px-4 py-3 bg-gray-800 text-white border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 mb-2 text-center" aria-label="Número de telefone"/>
              {error && <p className="text-red-400 text-sm mb-4" role="alert">{error}</p>}
              <div className="flex justify-center gap-4 mt-4">
                <button onClick={handleSave} className="px-6 py-2 text-lg font-semibold text-black bg-gradient-to-br from-amber-400 to-yellow-500 rounded-lg shadow-md hover:from-amber-500 hover:to-yellow-600 focus:outline-none focus:ring-4 focus:ring-yellow-400 transition-all duration-300">Salvar</button>
                <button onClick={handleClose} className="px-6 py-2 text-lg font-semibold text-white bg-gray-700 rounded-lg shadow-md hover:bg-gray-600 focus:outline-none focus:ring-4 focus:ring-gray-500 transition-colors duration-300">Cancelar</button>
              </div>
              <p className="text-sm text-gray-400 mt-6">Após salvar, clique em <strong>GIRAR</strong> novamente.</p>
            </div>
          </div>
        );
      };

      const WinnersList = ({ winners }) => {
        if (winners.length === 0) return <p className="text-gray-400 mt-2">Nenhum ganhador ainda.</p>;
        return (
          <div className="w-full max-w-md mt-4">
            <h3 className="text-xl text-amber-400 font-bold mb-2 text-center">Lista de Ganhadores</h3>
            <div className="bg-gray-900 bg-opacity-70 rounded-lg p-3 max-h-48 overflow-y-auto">
              <ul>
                {winners.map((winner, index) => (
                  <li key={index} className="text-sm text-white border-b border-gray-700 last:border-b-0 py-2"><span className="font-bold">{winner.name}</span> ({winner.phone}) - <span className="text-amber-300">{winner.prizeName}</span></li>
                ))}
              </ul>
            </div>
          </div>
        );
      };

      const [isSpinning, setIsSpinning] = useState(false);
      const [rotation, setRotation] = useState(0);
      const [wonPrize, setWonPrize] = useState(null);
      const [isInfoModalOpen, setIsInfoModalOpen] = useState(false);
      const [userName, setUserName] = useState(() => {
        try { return JSON.parse(window.localStorage.getItem('userName')) || null; } catch { return null; }
      });
      const [userPhone, setUserPhone] = useState(() => {
        try { return JSON.parse(window.localStorage.getItem('wheelPhone')) || null; } catch { return null; }
      });
      const [currentIndex, setCurrentIndex] = useState(0); // agora sincronizamos com JSONBin ao girar
      const [usedPhones, setUsedPhones] = useState(() => {
        try { return JSON.parse(window.localStorage.getItem('usedPhones')) || []; } catch { return []; }
      });
      const [winnersList, setWinnersList] = useState(() => {
        try { return JSON.parse(window.localStorage.getItem('winnersList')) || []; } catch { return []; }
      });
      const [notification, setNotification] = useState(null);

      useEffect(() => {
        try {
          window.localStorage.setItem('usedPhones', JSON.stringify(usedPhones));
          window.localStorage.setItem('winnersList', JSON.stringify(winnersList));
          if (userName) window.localStorage.setItem('userName', JSON.stringify(userName)); else window.localStorage.removeItem('userName');
          if (userPhone) window.localStorage.setItem('wheelPhone', JSON.stringify(userPhone)); else window.localStorage.removeItem('wheelPhone');
        } catch (error) { console.error('Erro ao salvar no localStorage', error); }
      }, [usedPhones, winnersList, userName, userPhone]);

      const showNotification = (message) => { setNotification(message); setTimeout(()=>setNotification(null), 3000); };

      const handleReset = async () => {
        const password = prompt("Para resetar, digite a senha de administrador:");
        if (password === ADMIN_PASSWORD) {
          if (confirm('Tem certeza que deseja resetar a roleta? Todos os dados serão apagados.')) {
            // tenta resetar no JSONBin também (precisa da API key)
            try {
              await fetch(JSONBIN_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_API },
                body: JSON.stringify({ currentIndex: 0 })
              });
            } catch (err) {
              console.warn('Não foi possível resetar o JSONBin automaticamente (verifique a API key).', err);
            }
            localStorage.removeItem('usedPhones'); localStorage.removeItem('userName'); localStorage.removeItem('wheelPhone'); localStorage.removeItem('winnersList');
            alert('Roleta resetada com sucesso! A página será recarregada.');
            window.location.reload();
          }
        } else if (password !== null) { alert('Senha incorreta!'); }
      };

      // Função que lê índice do JSONBin e retorna o index no array PRIZES a partir da PRIZES_SEQUENCE
      const getGlobalIndexAndWinner = useCallback(async () => {
        const idxFromBin = await fetchCurrentIndexFromBin();
        // idxFromBin refere-se à posição dentro de PRIZES_SEQUENCE
        const sequencePosition = idxFromBin % PRIZES_SEQUENCE.length;
        const prizeName = PRIZES_SEQUENCE[sequencePosition];
        const prizeObj = PRIZES.find(p => p.name === prizeName) || PRIZES[0];
        return { seqIndex: sequencePosition, prize: prizeObj };
      }, []);

      const startSpin = useCallback(async () => {
        if (isSpinning || !userPhone || !userName) return;
        if (userPhone !== ADMIN_PHONE && usedPhones.includes(userPhone)) { alert('Este número de telefone já participou da promoção.'); return; }

        setIsSpinning(true);

        // pega do JSONBin o índice atual na sequência
        const idxFromBin = await fetchCurrentIndexFromBin();
        const sequencePosition = idxFromBin % PRIZES_SEQUENCE.length;
        const targetPrizeName = PRIZES_SEQUENCE[sequencePosition];
        const winningPrizeIndex = PRIZES.findIndex(p => p.name === targetPrizeName);

        if (winningPrizeIndex < 0) {
          console.error("Prêmio não encontrado:", targetPrizeName);
          setIsSpinning(false);
          return;
        }

        // calcula rotação para alinhar no prêmio encontrado
        const segmentAngle = 360 / PRIZES.length;
        const winningAngle = 360 - (winningPrizeIndex * segmentAngle + segmentAngle / 2);
        const randomRotations = 5 + Math.floor(Math.random() * 3);
        const finalRotation = 360 * randomRotations + winningAngle;
        setRotation(prev => prev + finalRotation);

        // após animação, gravar vencedor e incrementar índice global no JSONBin
        setTimeout(async () => {
          const winningPrize = PRIZES[winningPrizeIndex];
          setWonPrize(winningPrize);
          setIsSpinning(false);

          // registra localmente
          if (userPhone === ADMIN_PHONE) {
            setWinnersList(prev => [...prev, { name: 'ADM TESTE', phone: userPhone, prizeName: winningPrize.name }]);
          } else {
            setUsedPhones(prev => [...prev, userPhone]);
            setWinnersList(prev => [...prev, { name: userName, phone: userPhone, prizeName: winningPrize.name }]);
          }

          // salva o próximo índice no JSONBin (incrementa)
          const nextIdx = (idxFromBin + 1) % PRIZES_SEQUENCE.length;
          await saveCurrentIndexToBin(nextIdx);
        }, SPIN_DURATION_MS + 200);
      }, [isSpinning, userName, userPhone, usedPhones, PRIZES, PRIZES_SEQUENCE]);

      const handleSpinClick = () => {
        if (isSpinning) return;
        if (userPhone && userName) startSpin();
        else setIsInfoModalOpen(true);
      };

      const handleSaveInfo = ({ name, phone }) => {
        setUserName(name); setUserPhone(phone); setIsInfoModalOpen(false); showNotification('Dados salvos! Clique em "GIRAR" novamente.');
      };

      return (
        <div className="flex flex-col items-center justify-center min-h-screen bg-black text-white p-4 overflow-hidden" style={{ background: 'radial-gradient(circle at center, #070707 0%, #000 100%)' }}>
          {notification && <div className="fixed top-5 bg-amber-500 text-black py-2 px-4 rounded-lg shadow-lg z-[60] animate-fade-in-down font-semibold">{notification}</div>}
          <header className="text-center mb-8">
            <h1 className="text-4xl md:text-6xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-500 to-amber-400" style={{ textShadow: '0 0 12px rgba(255,215,0,0.25)' }}>Roleta Premiada</h1>
            <p className="text-lg text-amber-100 opacity-80 mt-2">Gire a roleta para ganhar prêmios incríveis!</p>
          </header>
          <main className="relative flex flex-col items-center justify-center w-full max-w-lg mx-auto">
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[calc(100%-20px)] h-[calc(100%-20px)] md:w-[calc(100%-40px)] md:h-[calc(100%-40px)] pointer-events-none casino-lights" aria-hidden="true"></div>
            <SpinnerMarker />
            <SpinnerWheel prizes={PRIZES} rotation={rotation} spinDuration={SPIN_DURATION_MS} />
          </main>
          <footer className="mt-8 text-center">
            <button onClick={handleSpinClick} disabled={isSpinning} className="px-10 py-4 text-xl font-bold text-black bg-gradient-to-br from-amber-400 to-yellow-500 rounded-full shadow-lg hover:from-amber-500 hover:to-yellow-600 focus:outline-none focus:ring-4 focus:ring-yellow-400 focus:ring-opacity-70 transition-all duration-300 ease-in-out disabled:bg-gray-600 disabled:text-gray-400 disabled:cursor-not-allowed transform hover:scale-105 disabled:scale-100" style={{boxShadow: '0 8px 20px rgba(255,215,0,0.22)'}}>
              {isSpinning ? 'Girando...' : 'GIRAR'}
            </button>
            {userPhone === ADMIN_PHONE && (
              <div className="mt-4 p-4 bg-gray-900 bg-opacity-50 rounded-lg w-full max-w-md">
                <div className="flex justify-between items-center mb-3">
                  <p className="text-amber-400 font-semibold text-lg">Giross: <span className="text-white text-xl">{/* currentIndex not shown live here */} — </span></p>
                  <button onClick={handleReset} className="px-4 py-2 text-sm font-semibold text-white bg-red-700 rounded-lg shadow-md hover:bg-red-800 focus:outline-none focus:ring-4 focus:ring-red-500 transition-colors duration-300">Resetar Roleta</button>
                </div>
                <WinnersList winners={winnersList} />
              </div>
            )}
          </footer>
          <PrizeModal isOpen={!!wonPrize} prize={wonPrize} onClose={() => setWonPrize(null)} userName={userName} userPhone={userPhone} />
          <InfoModal isOpen={isInfoModalOpen} onClose={() => setIsInfoModalOpen(false)} onSave={handleSaveInfo} />
        </div>
      );
    };

    // Render
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
