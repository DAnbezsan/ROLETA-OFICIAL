<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta Premiada Interativa</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body { background-color: #000; margin:0; font-family: sans-serif; }
.casino-lights::before, .casino-lights::after { content:""; position:absolute; inset:-4px; border-radius:50%; background: conic-gradient(from 0deg, rgba(255,215,0,0.95) 0 12deg, transparent 12deg 36deg); mask: radial-gradient(closest-side, transparent 0 95%, black 96%); animation: spin-lights 5s linear infinite; filter: blur(2px);}
.casino-lights::after { animation-duration:8s; opacity:0.7; filter: blur(4px) saturate(1.2);}
@keyframes spin-lights { from{ transform: rotate(0deg);} to{ transform: rotate(360deg);} }
.animate-fade-in-down { animation: fade-in-down 0.5s ease-out forwards;}
@keyframes fade-in-down {0%{opacity:0; transform:translateY(-20px);}100%{opacity:1; transform:translateY(0);}}
.animate-fade-in-scale { animation:fade-in-scale 0.3s ease-out forwards;}
@keyframes fade-in-scale {0%{opacity:0; transform:scale(0.8);}100%{opacity:1; transform:scale(1);}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
// ========== CONFIGURAÇÃO JSONBIN =============
const JSONBIN_ID = "SEU_BIN_ID";    // <-- substitua aqui
const JSONBIN_API = "SUA_X-MASTER-KEY";  // <-- substitua aqui
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;
// ==============================================

// ==================== PRÊMIOS ====================
const PRIZES = [
  { id: 1, name: 'DESIGN 50%', emoji: '🎉' },
  { id: 2, name: 'FIO A FIO 50%', emoji: '✨' },
  { id: 3, name: 'SHADOW L. 50%', emoji: '💖' },
  { id: 4, name: 'DESIGN 100%', emoji: '🎁' },
  { id: 5, name: 'FIO A FIO 100%', emoji: '💎' },
  { id: 6, name: 'SHADOWL 100%', emoji: '🏆' },
];

const PRIZES_SEQUENCE = [
  'DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%',
  'FIO A FIO 50%','FIO A FIO 50%','FIO A FIO 50%',
  'DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%',
  'SHADOW L. 50%','SHADOW L. 50%',
  'DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%','DESIGN 50%',
  'FIO A FIO 50%','FIO A FIO 50%','FIO A FIO 50%',
  'DESIGN 50%','DESIGN 50%','DESIGN 50%',
  'FIO A FIO 50%','FIO A FIO 50%',
  'SHADOWL 100%',
  'DESIGN 100%','DESIGN 100%',
  'DESIGN 50%','DESIGN 50%',
  'SHADOW L. 50%','SHADOW L. 50%',
  'FIO A FIO 100%',
  'FIO A FIO 50%','FIO A FIO 50%',
  'DESIGN 100%','DESIGN 100%','DESIGN 100%',
  'SHADOW L. 50%',
  'DESIGN 100%','DESIGN 100%',
  'FIO A FIO 100%',
  'SHADOWL 100%',
  'FIO A FIO 100%'
];

const SPIN_DURATION_MS = 4200;
const OWNER_WHATSAPP = "5577981633924";
const ADMIN_PHONE = "77998652620";
const ADMIN_PASSWORD = "adm0832";

// ================== HELPERS JSONBIN ==================
async function fetchCurrentIndexFromBin() {
  try {
    const res = await fetch(JSONBIN_URL + "/latest", {
      headers: { "X-Master-Key": JSONBIN_API }
    });
    if (!res.ok) throw new Error('Erro fetch index');
    const data = await res.json();
    return typeof data.record.currentIndex === 'number' ? data.record.currentIndex : 0;
  } catch (err) {
    console.warn('Erro JSONBin, usando 0', err);
    return 0;
  }
}

async function saveCurrentIndexToBin(idx) {
  try {
    await fetch(JSONBIN_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json","X-Master-Key": JSONBIN_API },
      body: JSON.stringify({ currentIndex: idx })
    });
  } catch (err) { console.error('Erro ao salvar JSONBin', err);}
}

// ==================== COMPONENTES REACT ====================
const SpinnerMarker = () => (
  <div className="absolute -top-3 left-1/2 -translate-x-1/2 z-10">
    <svg width="40" height="56" viewBox="0 0 40 56" fill="none">
      <path d="M20 56L40 20L20 0L0 20L20 56Z" fill="#111"/>
      <path d="M20 52L36 20L20 4L4 20L20 52Z" fill="gold"/>
    </svg>
  </div>
);

const SpinnerWheel = ({ prizes, rotation, spinDuration }) => {
  const numPrizes = prizes.length;
  const anglePerSegment = 360 / numPrizes;
  const radius = 160;
  const viewBoxSize = radius*2 + 40;
  const getCoordinatesForAngle = (angle, r=radius) => {
    const rad = angle*Math.PI/180;
    return [r*Math.cos(rad), r*Math.sin(rad)];
  };
  return (
    <div className="relative w-[360px] h-[360px]" style={{transform:`rotate(${rotation}deg)`, transition:`transform ${spinDuration}ms cubic-bezier(0.25,0.1,0.25,1)`}}>
      <svg viewBox={`-${viewBoxSize/2} -${viewBoxSize/2} ${viewBoxSize} ${viewBoxSize}`} className="w-full h-full" style={{transform:'rotate(-90deg)'}}>
        {prizes.map((p,i)=>{
          const start = i*anglePerSegment, end=(i+1)*anglePerSegment;
          const [sx,sy] = getCoordinatesForAngle(start), [ex,ey] = getCoordinatesForAngle(end);
          const path = `M0 0 L ${sx} ${sy} A ${radius} ${radius} 0 0 1 ${ex} ${ey} Z`;
          return <path key={p.id} d={path} fill={i%2===0?'gold':'gray'} stroke="#000" strokeWidth="1"/>;
        })}
      </svg>
    </div>
  );
};

const PrizeModal = ({ isOpen, prize, onClose, userName, userPhone }) => {
  if (!isOpen || !prize) return null;
  const handleWhatsApp = () => {
    const msg = `🎉 Olá! Meu nome é ${userName} e ganhei: ${prize.name}\n📱 ${userPhone}`;
    window.open(`https://wa.me/${OWNER_WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank");
  };
  return (
    <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-gray-900 p-6 rounded-lg" onClick={e=>e.stopPropagation()}>
        <h2 className="text-2xl mb-4">Parabéns, {userName}!</h2>
        <div className="text-6xl mb-4">{prize.emoji}</div>
        <p className="mb-4">{prize.name}</p>
        <button onClick={handleWhatsApp} className="bg-green-500 text-white px-4 py-2 rounded mr-2">WhatsApp</button>
        <button onClick={onClose} className="bg-gray-700 text-white px-4 py-2 rounded">Fechar</button>
      </div>
    </div>
  );
};

// ==================== APP PRINCIPAL ====================
const App = () => {
  const {useState, useEffect} = React;
  const [rotation,setRotation] = useState(0);
  const [wonPrize,setWonPrize] = useState(null);
  const [userName,setUserName] = useState(()=>localStorage.getItem('userName')||'');
  const [userPhone,setUserPhone] = useState(()=>localStorage.getItem('wheelPhone')||'');
  const [usedPhones,setUsedPhones] = useState(()=>JSON.parse(localStorage.getItem('usedPhones')||'[]'));
  const [winnersList,setWinnersList] = useState(()=>JSON.parse(localStorage.getItem('winnersList')||'[]'));
  const [isSpinning,setIsSpinning] = useState(false);

  useEffect(()=>{
    localStorage.setItem('usedPhones',JSON.stringify(usedPhones));
    localStorage.setItem('winnersList',JSON.stringify(winnersList));
    localStorage.setItem('userName',userName);
    localStorage.setItem('wheelPhone',userPhone);
  },[usedPhones,winnersList,userName,userPhone]);

  const startSpin = async ()=>{
    if(isSpinning) return;
    if(!userName || !userPhone){ alert('Informe seu nome e telefone!'); return;}
    if(usedPhones.includes(userPhone) && userPhone!==ADMIN_PHONE){ alert('Número já participou!'); return;}
    setIsSpinning(true);
    let idx = await fetchCurrentIndexFromBin();
    const seqPos = idx % PRIZES_SEQUENCE.length;
    const prizeName = PRIZES_SEQUENCE[seqPos];
    const prizeObj = PRIZES.find(p=>p.name===prizeName) || PRIZES[0];
    const segAngle = 360/PRIZES.length;
    const prizeIdx = PRIZES.findIndex(p=>p.name===prizeName);
    const angle = 360*5 + (360 - (prizeIdx*segAngle + segAngle/2));
    setRotation(prev=>prev+angle);
    setTimeout(async ()=>{
      setWonPrize(prizeObj);
      setIsSpinning(false);
      setUsedPhones(prev=>[...prev,userPhone]);
      setWinnersList(prev=>[...prev,{name:userName,phone:userPhone,prizeName:prizeObj.name}]);
      await saveCurrentIndexToBin(idx+1);
    }, SPIN_DURATION_MS);
  };

  return (
    <div className="flex flex-col items-center justify-center min-h-screen bg-black text-white p-4">
      <h1 className="text-4xl font-bold mb-4">Roleta Premiada</h1>
      <SpinnerMarker/>
      <SpinnerWheel prizes={PRIZES} rotation={rotation} spinDuration={SPIN_DURATION_MS}/>
      <button onClick={startSpin} disabled={isSpinning} className="mt-6 px-6 py-3 rounded bg-yellow-500 text-black">{isSpinning?'Girando...':'GIRAR'}</button>
      <PrizeModal isOpen={!!wonPrize} prize={wonPrize} onClose={()=>setWonPrize(null)} userName={userName} userPhone={userPhone}/>
      <div className="mt-6">
        <h2 className="text-xl mb-2">Lista de Ganhadores</h2>
        <ul>
          {winnersList.map((w,i)=><li key={i}>{w.name} ({w.phone}) - {w.prizeName}</li>)}
        </ul>
      </div>
    </div>
  );
};

// Render
const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App/>);
</script>
</body>
</html>
